name: Storage service CI

on:
  push:
    branches: [main]
    paths:
      - "storage-service/**"
      - ".github/workflows/storage-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "storage-service/**"
      - ".github/workflows/storage-ci.yml"

jobs:
  test-lint-build:
    name: Test, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: storage-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test (pytest)
        run: pytest

      - name: Lint (ruff check .)
        run: ruff check .

      - name: Build (docker build)
        run: docker build -t lost-and-found-back .
