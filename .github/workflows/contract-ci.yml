name: Smart contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-lint-build:
    name: Test, lint, build (+ coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test (npx hardhat test)
        run: npx hardhat test

      - name: Lint (npx solhint)
        run: npx solhint 'contracts/**/*.sol'

      - name: Build (npx hardhat compile)
        run: npx hardhat compile

      - name: Coverage (npx hardhat coverage)
        run: npx hardhat coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidity-coverage-report
          path: coverage/
